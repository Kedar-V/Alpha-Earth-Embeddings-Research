.slide img{width:100%;height:100%;object-fit:contain}

#chrome button{background:#2a3144;color:#eef1f7;border:0;border-radius:6px;padding:.4rem .75rem;cursor:pointer}
</style></head><body>

<div id="chrome">
  <div><button id="prev">← Prev</button> <button id="next">Next →</button></div>
  <div>week4_briefing.pdf · full pptx has synthesis + plot appendix</div>
  <div id="counter">1 / 22</div>
</div>
<script>
const slides=[...document.querySelectorAll('.slide')]; let i=0;
const counter=document.getElementById('counter');
function show(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,j)=>s.classList.toggle('active',j===i));counter.textContent=(i+1)+' / '+slides.length;history.replaceState(null,'','#'+(i+1));}
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
window.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(i+1);}
  if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(i-1);}
});
const h=parseInt((location.hash||'#1').slice(1),10); show(Number.isFinite(h)&&h>0?h-1:0);
</script></body></html>
