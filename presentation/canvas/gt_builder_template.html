        if (k >= BAL_ORD[balSel]) { ctx.fillStyle = rgba(b.status === "res" ? C.res : C.nres, 0.7); ctx.fill() }
        else if (k) { ctx.fillStyle = hatch; ctx.fill(); ctx.fillStyle = rgba(C.excl, 0.35); ctx.fill() } }
      if (id === "cluster" && b.status !== "excluded" && b.kept > 0) {
        ctx.fillStyle = rgba(b.status === "res" ? C.res : C.nres, 0.15 + 0.8 * Math.sqrt(b.kept / keptMax)); ctx.fill() }
      if (id === "score") {
        if (b.test && b.test.vr != null && b.test.gr != null) { const e = errB(b, truth);
          ctx.fillStyle = rgba(e.v < e.g ? css("--accent") : C.ghsl, 0.72); ctx.fill() }
        else { ctx.fillStyle = "rgba(255,255,255,.08)"; ctx.fill() }
      }
      const outline = (id === "src" || id === "snap") ? "#ffffff" : b.status === "excluded" ? "rgba(255,255,255,.7)" : b.status === "res" ? C.res : C.nres;
      ctx.strokeStyle = after("cover") && id !== "spec" ? "rgba(255,255,255,.75)" : outline;
      ctx.lineWidth = (after("cover") && id !== "spec" ? 0.9 : 1.4) * dpr; ctx.stroke();
    });
  });
  if (id === "cluster") {                       // label the biggest contributors with their cell counts
    ctx.font = `600 ${11 * dpr}px ${css("--mono")}`; ctx.textAlign = "center";
    keptTop.slice(0, 6).filter(b => b.kept >= 2).forEach(b => { const r = b.rings[0]; let x = 0, y = 0; r.forEach(p => { x += p[0]; y += p[1] });
      const [px, py] = tx([x / r.length, y / r.length]); const t = fmt(b.kept, b.kept % 1 ? 1 : 0);
      ctx.fillStyle = "rgba(11,15,19,.75)"; const w = ctx.measureText(t).width; ctx.fillRect(px - w / 2 - 4 * dpr, py - 9 * dpr, w + 8 * dpr, 16 * dpr);
      ctx.fillStyle = "#fff"; ctx.fillText(t, px, py + 3 * dpr) });
    ctx.textAlign = "left";
  }
  if (hover) highlight();
  scaleBar();
}
function scaleBar() {
  const m = 50 / COS;  // 50 true metres in Mercator metres
  const [x0] = tx([0, 0]), [x1] = tx([m, 0]); const L = x1 - x0;
  const X = 14 * dpr, Y = cv.height - 16 * dpr;
  ctx.fillStyle = "rgba(11,15,19,.7)"; ctx.fillRect(X - 6 * dpr, Y - 20 * dpr, L + 12 * dpr, 28 * dpr);
  ctx.fillStyle = "#fff"; ctx.fillRect(X, Y, L, 3 * dpr); ctx.font = `${12 * dpr}px ${css("--mono")}`; ctx.fillText("50 m", X, Y - 6 * dpr);
}

// ---------- hover
let hover = null;
function pick(mx, my) {
  const p = [((mx - view.x) / view.k) / base(), ((my - view.y) / view.k) / base()], id = SID();
  const bAt = () => B.find(b => inB(p, b)), cAt = () => CELLS.find(c => inside(p, c.ring));
  if (id === "score" || id === "cluster" || id === "bal" || (id === "twogt" && gtSel === "bld")) { const b = bAt(); return b ? { b } : null }
  if (id === "own") { const t = (gridSel === "ae" ? AE_T : GH_T).find(t => inside(p, t.ring)); return t ? { t } : null }
  if (id === "ghsl") { const g = G.find(g => inside(p, g.ring)); const c = cAt(); const b = bAt(); return g || c || b ? { g, c, b } : null }
  if (CELL_STEPS.includes(id) || id === "twogt") { const c = cAt(); const b = bAt(); return c || b ? { c, b } : null }

}
function highlight() { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.4 * dpr;

function spark(v) { const w = 230, h = 34, mn = Math.min(...v), mx = Math.max(...v);
  const pts = v.map((y, i) => `${(i / 63 * w).toFixed(1)},${(h - 2 - (y - mn) / (mx - mn || 1) * (h - 4)).toFixed(1)}`).join(" ");

function bText(b) {

  if (id === "twogt" && b.status !== "excluded") s += b.noCentre ? `<br><b>No AlphaEarth cell centre inside:</b> no soft truth, so this footprint drops out of the building test`
    : !b.soft ? `<br><span class="k">partly outside this window</span>; ${b.nStored} cell centres inside in the full data` : (b.edge ? `<br><span class="k">partly outside this window:</span> truth below uses the ${b.nIn} of ${b.nStored} cells loaded here` : "") + `<br><span class="k">building truth</span> res ${pct(b.soft.r)} · non-res ${pct(b.soft.n)} · empty ${pct(Math.max(0, 1 - b.soft.r - b.soft.n))}<br><span class="k">from</span> ${b.nIn} cell centre${b.nIn === 1 ? "" : "s"} inside`;
  if ((id === "fix1" || id === "fix2" || id === "fix3") && b.status !== "excluded") { const q = BAL.window[b.id];
    s += !q ? "" : q.b === -1 ? `<br><b>Fails step 1:</b> no AlphaEarth cell centre inside (${b.nStored} in the full data)` : id === "fix1" ? `<br><b>Passes step 1</b> · ${b.nStored} cell centres inside`
      : q.b === 1 ? `<br><b>Kept</b> in the area-balanced set` : `<br><b>Cut in step 2</b>: NYC has more residential area, so houses are drawn at random (seed ${BAL.seed}) and this one fell past the target` }
  else if (id === "bal" && b.status !== "excluded") { const q = BAL.window[b.id];
    s += !q ? `<br><span class="k">not in the week 6 building table</span>` : q.s === "cut" ? `<br><b>Cut by 1:1 balancing</b> (random, seed ${BAL.seed})`
      : q.s === "test" ? `<br><span class="k">kept:</span> balanced pool → training → frozen test` : `<br><span class="k">kept:</span> balanced pool${q.s === "train" ? " → training" : ""}<br><b>Not in the test set:</b> ${q.why}` }
  if (id === "cluster" && b.status !== "excluded") s += `<br><span class="k">training cells from this footprint</span> ${fmt(b.kept, b.kept % 1 ? 1 : 0)}`;
  if (id === "ghsl" && b.g_fr != null) s += `<br><span class="k">GHSL under footprint</span> res ${pct(b.g_fr)} · non-res ${pct(b.g_fn)} (${b.g_npix} px)`;
  if (id === "score") {
    if (!b.test) return s + `<br><span class="k">not in the frozen test set</span>`;
    const t = b.test, e = errB(b, truth);
    s += `<br><span class="k">truth</span> ${truth === "soft" ? `res ${pct(t.sr)} · non-res ${pct(t.sn)} (soft)` : (t.y ? "residential (hard)" : "non-residential (hard)")}` +
         `<br><span class="k">model</span> res ${pct(clip(t.vr))} · non-res ${pct(clip(t.vn))} · error ${e.v.toFixed(3)}` +
         `<br><span class="k">GHSL</span> res ${pct(t.gr)} · non-res ${pct(t.gn)} · error ${e.g.toFixed(3)}` +
         (t.se != null ? `<br><span class="k">empty share</span> truth ${pct(t.se)} · week 11 model ${pct(clip(t.ee))} · GHSL ${pct(clip(1 - t.gr - t.gn))}` : "");
  }
  return s;
}
function cText(c) {
  if (!c) return "";
  const id = SID();
  let s = `<b>10 m cell</b> <span class="k">${c.pid ? "id " + c.pid : "no tagged building"}</span><br>` +
    `<span class="k">residential</span> ${pct(c.fr)} · <span class="k">non-res</span> ${pct(c.fn)} · <span class="k">empty</span> ${pct(emptyShare(c))}` +
    `<div style="display:flex;height:8px;border-radius:3px;overflow:hidden;margin:4px 0;background:var(--empty)"><span style="width:${Math.min(100, c.fr * 100)}%;background:var(--res)"></span><span style="width:${Math.min(100, c.fn * 100)}%;background:var(--nres)"></span></div>` +
    `<span class="k">cell type</span> ${c.stratum} · <span class="k">3-class label</span> ${decode3(c)}`;
  if (id === "comp" && (c.stratum === "res" || c.stratum === "nres") && onUntagged(c)) s += `<br>Also sits on an untagged footprint, counted as empty`;
  if (id === "sample" && (c.stratum === "res" || c.stratum === "nres")) s += pureRule === "any" ? `<br>${c.kept ? "Kept for training" : "Dropped by balancing"}`
      : `<br>${isFull(c) ? "Fully covered: eligible" : "Partly covered: excluded under this rule"}`;
  if (id === "ae" && c.ae) s += `<br><span class="k">64 AlphaEarth values</span>${spark(c.ae)}` + (c.p_res != null ? `<span class="k">held-out model</span> P(residential) ${c.p_res.toFixed(2)}` : "");
  if (id === "ghsl" && c.g_fr != null) s += `<br><span class="k">GHSL at this centre</span> res ${pct(c.g_fr)} · non-res ${pct(c.g_fn)}`;
  return s;
}
function showTip(e) {
  const r = cv.getBoundingClientRect(); const mx = e.clientX - r.left, my = e.clientY - r.top;
  hover = pick(mx, my); draw();
  if (!hover) { tip.hidden = true; return }
  const id = SID();
  if (id === "own" && hover.t) { const t = hover.t, ae = gridSel === "ae";
    const gr = ae ? t.fr : t.gt_r, gn = ae ? t.fn : t.gt_n, pr = ae ? t.ae_pr : t.fr, pn = ae ? t.ae_pn : t.fn;
    tip.innerHTML = `<b>${ae ? "AlphaEarth" : "GHSL"} tile</b><br><span class="k">truth on this tile</span> res ${pct(gr)} · non-res ${pct(gn)} · empty ${pct(Math.max(0, 1 - gr - gn))}` +
      `<br><span class="k">${ae ? "AlphaEarth" : "GHSL"} says</span> res ${pct(clip(pr))} · non-res ${pct(clip(pn))}` +
      `<br><span class="k">class</span> truth ${t.tc} · predicted ${t.pc} · <b>${t.ok3 ? "right" : "wrong"}</b><br><span class="k">share error</span> ${tileErr(pr, pn, gr, gn).toFixed(3)}`;
  } else {
    let html = hover.c ? cText(hover.c) + (hover.b ? "<hr style='border:0;border-top:1px solid var(--line);margin:6px 0'>" + bText(hover.b) : "") : bText(hover.b);
    if (id === "ghsl" && hover.g) html = `<b>GHSL cell</b><br><span class="k">built-up</span> ${hover.g.bu === 255 ? "no data" : hover.g.bu + "%"} · <span class="k">flag</span> ${hover.g.nres === 1 ? "non-residential" : "residential"}<hr style='border:0;border-top:1px solid var(--line);margin:6px 0'>` + html;
    tip.innerHTML = html;
  }
  tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.max(4, Math.min(mx + 14, r.width - tw - 6)) + "px"; tip.style.top = Math.max(4, Math.min(my + 14, r.height - th - 6)) + "px";
}

// ---------- pan / zoom
let drag = null;
cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; cv.setPointerCapture(e.pointerId) });
cv.addEventListener("pointermove", e => { if (drag) { view.x = drag.vx + (e.clientX - drag.x); view.y = drag.vy + (e.clientY - drag.y); tip.hidden = true; draw() } else showTip(e) });
cv.addEventListener("pointerup", () => drag = null);
cv.addEventListener("pointerleave", () => { hover = null; tip.hidden = true; draw() });
cv.addEventListener("wheel", e => { e.preventDefault(); const r = cv.getBoundingClientRect(); const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.min(12, Math.max(1, view.k * (e.deltaY < 0 ? 1.15 : 1 / 1.15))); view.x = mx - (mx - view.x) * k / view.k; view.y = my - (my - view.y) * k / view.k; view.k = k; draw() }, { passive: false });
document.getElementById("reset").onclick = () => { view = { k: 1, x: 0, y: 0 }; draw() };

// ---------- UI
const stepsEl = document.getElementById("steps"), bodyEl = document.getElementById("body");
STEPS.forEach((s, i) => { const li = document.createElement("li"); li.innerHTML = `<button id="step-${i}"><span class="n">${i + 1}</span><span>${s.t}</span></button>`;
  li.firstChild.onclick = () => go(i); stepsEl.appendChild(li) });
const CTL = {
  rule: () => seg("rule", [["any", "Any coverage"], ["full", "Fully covered"], ["three", "Three classes"]], pureRule),
  grid: () => seg("grid", [["ae", "AlphaEarth tiles"], ["ghsl", "GHSL tiles"]], gridSel),
  own: () => seg("grid", [["ae", "AlphaEarth tiles"], ["ghsl", "GHSL tiles"]], gridSel) + " " + seg("metric", [["right", "Right / wrong"], ["bal", "Balanced 1:1"], ["err", "Share error"]], ownMetric),
  view: () => seg("view", [["two", "Two shares"], ["three", "Three classes (with empty)"]], view3),
  centres: () => seg("centres", [["off", "Fair: own grids"], ["on", "Week 4: read at AE centres"]], showCentres ? "on" : "off"),
  truth: () => seg("truth", [["soft", "Soft truth"], ["hard", "Hard truth (no grid)"]], truth),
  comp: () => seg("comp", [["window", "This window"], ["all", "All ten boxes"]], compSel),
  fixreg: () => `<div class="chipset" role="group" aria-label="Study box">${FR.map(r => `<button data-ctl="fixreg" data-v="${r.name}" aria-pressed="${r.name === fixReg}">${short(r.name)}</button>`).join("")}</div>`,
  bal: () => seg("bal", [["labelled", "1. Labelled"], ["pool", "2. 1:1 count"], ["train", "3. Training"], ["test", "4. Test"]], balSel),
  gt: () => seg("gt", [["cell", "A. Cell truth"], ["bld", "B. Building truth"]], gtSel),
  region: () => `<div class="chipset" role="group" aria-label="Study box">${RG.map(r => `<button data-ctl="region" data-v="${r.name}" aria-pressed="${r.name === regSel}">${short(r.name)}</button>`).join("")}</div>`,
};
function seg(name, opts, cur) { return `<div class="seg" role="group" aria-label="${name}" style="margin:2px 0 10px">${opts.map(([v, l]) =>
  `<button data-ctl="${name}" data-v="${v}" id="ctl-${name}-${v}" aria-pressed="${v === cur}">${l}</button>`).join("")}</div>` }
function go(i, keepView) {
  step = Math.max(0, Math.min(STEPS.length - 1, i)); const s = STEPS[step]; hover = null; tip.hidden = true;
  document.querySelectorAll("ol.steps button").forEach((b, j) => b.setAttribute("aria-current", j === step ? "step" : "false"));
  const leg = val(s.leg) || [];
  const stats = val(s.s) || [];
  bodyEl.innerHTML = `<h2>${step + 1}. ${s.h}</h2>${s.ctl ? CTL[s.ctl]() : ""}${val(s.p).map(t => `<p>${t}</p>`).join("")}
    ${stats.length ? `<div class="stats">${stats.map(([v, l]) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}</div>` : ""}
    ${s.extra ? s.extra() : ""}
    <div class="legend">${leg.map(([c, l, b]) => `<span style="--c:${c};--b:${b || "transparent"}">${l}</span>`).join("")}</div>
    <p class="src" style="margin-top:10px">Source: ${val(s.src)}</p>`;
  bodyEl.querySelectorAll("[data-ctl]").forEach(btn => btn.onclick = () => {
    const n = btn.dataset.ctl, v = btn.dataset.v;
    if (n === "rule") pureRule = v; if (n === "view") view3 = v; if (n === "grid") gridSel = v; if (n === "centres") showCentres = v === "on"; if (n === "truth") truth = v;
    if (n === "metric") ownMetric = v; if (n === "comp") compSel = v; if (n === "gt") gtSel = v; if (n === "region") regSel = v; if (n === "bal") balSel = v; if (n === "w16m") w16m = v; if (n === "fixreg") fixReg = v;
    go(step, true) });
  document.getElementById("prev").disabled = step === 0;
  document.getElementById("next").textContent = step === STEPS.length - 1 ? "Back to start" : "Next step";
  if (!keepView && s.id === "ghsl" && view.k < 1.4) { view = { k: 2.4, x: -size * 0.7, y: -size * 0.7 } }
  if (!keepView && after("own")) { view = { k: 1, x: 0, y: 0 } }
  draw();
}
document.getElementById("prev").onclick = () => go(step - 1);
document.getElementById("next").onclick = () => go(step === STEPS.length - 1 ? 0 : step + 1);
document.addEventListener("keydown", e => { if (e.target.closest && e.target.closest("input")) return; if (e.key === "ArrowRight") go(step + 1); if (e.key === "ArrowLeft") go(step - 1) });
[["esri", "img-esri"], ["s2", "img-s2"], ["none", "img-none"]].forEach(([k, id]) => document.getElementById(id).onclick = () => {
  bg = k; ["img-esri", "img-s2", "img-none"].forEach(x => document.getElementById(x).setAttribute("aria-pressed", x === id)); draw(); attrib() });
document.getElementById("dim").oninput = draw;
function attrib() { document.getElementById("attrib").textContent = bg === "esri" ? "Imagery: Esri World Imagery (Esri, Maxar, Earthstar Geographics)" : bg === "s2" ? "Imagery: Sentinel-2 L2A, summer 2018 (Copernicus), 10 m pixels" : "" }
document.getElementById("scaleNote").textContent = "Scroll to zoom, drag to pan, hover for details. Arrow keys step through.";
Object.values(img).forEach(im => im.onload = draw);
